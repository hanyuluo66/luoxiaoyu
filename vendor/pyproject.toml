[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "wxauto"
version = "39.2.1"
description = "wxauto 3.9 archive (vendored for AI大肥鱼)"
requires-python = ">=3.8"
dependencies = [
    "tenacity",
    "pywin32",
    "pyperclip",
    "pillow",
    "psutil",
    "colorama",
    "comtypes",
]

[tool.setuptools]
packages = ["wxauto"]
